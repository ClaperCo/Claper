name: Elixir CI

on:
  push:
    branches: [ "main", "dev" ]
    tags: ['v*']
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  build:

    name: Build and test
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: claper
          POSTGRES_USER: claper
          POSTGRES_DB: claper
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      DATABASE_URL: postgresql://claper:claper@localhost:5432/claper
      SECRET_KEY_BASE: QMQE4ypfy0IC1LZI/fygZNvXHPjLslnr49EE7ftcL1wgAC0MwMLdKCVJyrvXPu8z
      BASE_URL: http://localhost:4000

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.18.4'
        otp-version: '28'
    - name: Restore dependencies cache
      uses: actions/cache@v3
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Check Formatting
      run: mix format --check-formatted
    - name: Check Credo Warnings
      run: mix credo diff --from-git-merge-base origin/main
    - name: Run tests
      run: mix test

  docker:
    name: Build Docker image (${{ matrix.arch }})
    needs: build
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/claperco/claper

    steps:
    - uses: actions/checkout@v4
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # The runtime stage (system packages) is published once per Dockerfile
    # revision, so its layers keep the same digest across releases and
    # servers only pull the application layer on deploy.
    - name: Check runtime base image
      id: runtime
      env:
        RUNTIME_IMAGE: ${{ env.IMAGE }}:runtime-${{ hashFiles('Dockerfile') }}-${{ matrix.arch }}
      run: |
        echo "image=$RUNTIME_IMAGE" >> "$GITHUB_OUTPUT"
        if docker buildx imagetools inspect "$RUNTIME_IMAGE" > /dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Build and push runtime base image
      if: steps.runtime.outputs.exists != 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        target: runtime
        platforms: ${{ matrix.platform }}
        push: true
        provenance: false
        tags: ${{ steps.runtime.outputs.image }}
    - name: Build and push Docker image by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          RUNTIME_BASE_IMAGE=${{ steps.runtime.outputs.image }}
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=docker-${{ matrix.arch }}
        cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max
    - name: Export digest
      run: |
        mkdir -p "${{ runner.temp }}/digests"
        digest="${{ steps.build.outputs.digest }}"
        touch "${{ runner.temp }}/digests/${digest#sha256:}"
    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  docker-merge:
    name: Push Docker multi-arch manifest
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/claperco/claper

    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-*
        merge-multiple: true
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE }}
        tags: |
          type=ref,event=branch
          type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Create and push manifest list
      working-directory: ${{ runner.temp }}/digests
      run: |
        docker buildx imagetools create \
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.IMAGE }}@sha256:%s ' *)
    - name: Inspect image
      run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}